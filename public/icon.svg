<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#22c55e" stroke-width="4" stroke-opacity="0.3" />

  <!-- Billing Receipt Card -->
  <g filter="url(#shadow)">
    <path d="M128 100 L384 100 L384 412 L352 396 L320 412 L288 396 L256 412 L224 396 L192 412 L160 396 L128 412 Z" fill="#ffffff" />
    
    <!-- Receipt Header Strip -->
    <rect x="152" y="132" width="208" height="20" rx="4" fill="#15803d" />
    
    <!-- Receipt Content Lines (Vegetable + Quantity mock) -->
    <!-- Line 1: Thakkali 12.5 -->
    <rect x="152" y="172" width="120" height="12" rx="3" fill="#334155" />
    <rect x="300" y="172" width="60" height="12" rx="3" fill="#16a34a" />

    <!-- Line 2: Ulli 50.25 -->
    <rect x="152" y="200" width="90" height="12" rx="3" fill="#334155" />
    <rect x="300" y="200" width="60" height="12" rx="3" fill="#16a34a" />

    <!-- Line 3: Inji 3.750 -->
    <rect x="152" y="228" width="80" height="12" rx="3" fill="#334155" />
    <rect x="300" y="228" width="60" height="12" rx="3" fill="#16a34a" />
    
    <!-- Dashed separator -->
    <line x1="152" y1="260" x2="360" y2="260" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6,4" />
    
    <!-- Typing Keyboard / Speed Blitz icon -->
    <circle cx="212" cy="324" r="28" fill="#ecfdf5" stroke="#10b981" stroke-width="4" />
    <!-- Weighing balance / leaf symbol -->
    <path d="M212 306 C224 306 228 320 228 328 C228 334 222 342 212 342 C202 342 196 334 196 328 C196 320 200 306 212 306 Z" fill="#10b981" />

    <!-- Digital LCD Speed Tag -->
    <rect x="256" y="304" width="104" height="40" rx="8" fill="#0f172a" />
    <text x="308" y="331" font-family="monospace" font-size="20" font-weight="bold" fill="#4ade80" text-anchor="middle">WPM</text>
  </g>
</svg>
